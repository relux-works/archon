version: "2"

linters:
  enable:
    - misspell
    - revive
    - gosec
  settings:
    gosec:
      excludes:
        # Everything Curator writes is a deliberately shareable artifact
        # (context files, markers, ledgers, shims, env helpers); none
        # carries secrets, and several must be world-readable or executable
        # to serve their purpose. The same applies to created directories.
        - G306
        - G301
        # Filesystem walks operate over tool-owned trees (snapshots, install
        # roots, the machine home); path names inside them are validated
        # through the identifier and relative-path rules of the protocol.
        - G122
        # Taint-analysis findings fire on operator-supplied paths (config
        # files, project roots) and protocol-validated relative paths; both
        # are trusted inputs by design.
        - G703
  exclusions:
    rules:
      # Tests may use weaker patterns than production code.
      - path: _test\.go
        linters:
          - gosec
      # These two original replay drivers are byte-pinned by the capture
      # manifest. Keep their intentional fixture callback parameters intact.
      - path: internal/harnessparity/launcher_fixture_test\.go
        text: "unused-parameter: parameter 'entry' seems to be unused"
        linters:
          - revive
      - path: internal/harnessparity/legacy_fixture_test\.go
        text: "unused-parameter: parameter 'manager' seems to be unused"
        linters:
          - revive
      - path: internal/harnessparity/legacy_fixture_test\.go
        text: "unused-parameter: parameter 'native' seems to be unused"
        linters:
          - revive
      # C15 replay files are byte-pinned to the captured source; keep the
      # syntax-only AST inventory and fixture helpers unchanged.
      - path: internal/harnessparity/ancestor_projection_test\.go
        text: "unused-parameter: parameter 't' seems to be unused"
        linters:
          - revive
      - path: internal/harnessparity/ancestor_projection_test\.go
        text: "ast.Object has been deprecated"
        linters:
          - staticcheck
      - path: internal/harnessparity/ancestor_projection_test\.go
        text: "Error return value of `os.RemoveAll` is not checked"
        linters:
          - errcheck
      - path: internal/harnessparity/ancestor_projection_test\.go
        text: "func assertFixtureAncestorRefusal is unused"
        linters:
          - unused
      - path: internal/harnessparity/legacy_fixture_test\.go
        text: "func isFixtureRootBindingRefusal is unused"
        linters:
          - unused
      - path: internal/harnessparity/legacy_fixture_test\.go
        text: "func projectFixtureRoot is unused"
        linters:
          - unused
